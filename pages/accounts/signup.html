<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f15">
  <title>إنشاء حساب جديد | رصيد — RASEED</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../src/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../../src/css/base.css">
  <link rel="stylesheet" href="../../src/css/auth.css">
</head>

<body class="auth-page">
  <main class="auth-card wide">
    <button id="btnThemeToggle" type="button" class="theme-toggle" aria-label="تبديل المظهر"></button>

    <a href="../../index.html" class="auth-brand-wrap" title="رصيد | RASEED">
      <img src="../../public/images/logo-dark.png" alt="رصيد RASEED" class="auth-brand-img logo-for-dark">
      <img src="../../public/images/logo-light.png" alt="رصيد RASEED" class="auth-brand-img logo-for-light">
    </a>

    <h1 class="auth-title">إنشاء حساب جديد</h1>
    <p class="auth-sub">سجّل الآن للاستفادة من الشحن المباشر وسجل العمليات</p>

    <div class="role-switch">
      <button type="button" class="role-btn active" data-role="user">حساب عميل شخصي</button>
      <button type="button" class="role-btn" data-role="merchant">حساب تاجر / موزع</button>
    </div>

    <form id="signupForm" action="#" method="post" class="form" novalidate>
      <div class="row g-3">
        <div class="col-12 col-sm-6">
          <label for="firstNameInput" class="form-label">الاسم الأول</label>
          <input id="firstNameInput" name="first_name" type="text" class="form-control" placeholder="الاسم الأول"
            autocomplete="given-name" required>
        </div>
        <div class="col-12 col-sm-6">
          <label for="lastNameInput" class="form-label">الاسم الأخير</label>
          <input id="lastNameInput" name="last_name" type="text" class="form-control" placeholder="الاسم الأخير"
            autocomplete="family-name" required>
        </div>
        <div class="col-12">
          <label for="emailInput" class="form-label">البريد الإلكتروني</label>
          <div class="input-with-icon-wrap">
            <span class="input-lead-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <input id="emailInput" name="email" type="email" class="form-control" placeholder="name@example.com"
              dir="ltr" autocomplete="email" required>
          </div>
        </div>
        <div class="col-12">
          <label for="phoneNumberInput" class="form-label">رقم الهاتف أو الواتساب</label>
          <div class="phone-input-group">
            <select id="phonePrefixSelect" class="form-select phone-prefix-select">
              <option value="+967" selected>+967 (اليمن)</option>
              <option value="+966">+966 (السعودية)</option>
              <option value="+964">+964 (العراق)</option>
              <option value="+971">+971 (الإمارات)</option>
              <option value="+965">+965 (الكويت)</option>
              <option value="+974">+974 (قطر)</option>
              <option value="+968">+968 (عُمان)</option>
              <option value="+973">+973 (البحرين)</option>
              <option value="+1">+1 (دولي)</option>
            </select>
            <input id="phoneNumberInput" name="phone" type="tel" class="form-control flex-grow-1" placeholder="7XXXXXXXX أو 05XXXXXXXX"
              dir="ltr" autocomplete="tel" required>
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <label for="passwordInput" class="form-label">كلمة المرور</label>
          <div class="password-wrap">
            <span class="input-lead-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input id="passwordInput" name="password" type="password" class="form-control"
              placeholder="••••••••" dir="ltr" autocomplete="new-password" required>
            <button type="button" class="password-toggle-btn" id="btnTogglePassword" aria-label="إظهار/إخفاء كلمة المرور">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <label for="passwordConfirmInput" class="form-label">تأكيد كلمة المرور</label>
          <div class="password-wrap">
            <span class="input-lead-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
            </span>
            <input id="passwordConfirmInput" name="password_confirm" type="password" class="form-control"
              placeholder="••••••••" dir="ltr" autocomplete="new-password" required>
            <button type="button" class="password-toggle-btn" id="btnTogglePasswordConfirm" aria-label="إظهار/إخفاء كلمة المرور">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="mt-3 form-check">
        <input class="form-check-input" type="checkbox" id="agreeTerms" required checked>
        <label class="form-check-label" for="agreeTerms" style="font-size:0.8rem;color:var(--text-secondary);cursor:pointer">
          أوافق على <a href="../terms.html" class="auth-link" target="_blank">شروط الخدمة وسياسة الضمان</a> و<a href="../privacy.html" class="auth-link" target="_blank">سياسة الخصوصية</a>.
        </label>
      </div>

      <button type="submit" class="btn btn-brand w-100 mt-3 py-2" id="btnSignupSubmit" style="font-size:0.92rem;">
        إنشاء الحساب
      </button>

      <div class="auth-divider">أو</div>

      <p class="auth-foot mb-0">
        لديك حساب بالفعل؟
        <a href="login.html" class="auth-link">تسجيل الدخول</a>
      </p>

      <p class="auth-foot mt-3 mb-0">
        <a href="../../index.html" class="auth-link" style="font-size:.82rem">← العودة إلى المتجر</a>
      </p>
    </form>
  </main>

  <div id="toastBox" class="toast-app" role="status" aria-live="polite">
    <span id="toastMsg"></span>
  </div>

  <script src="../../src/vendor/bootstrap.min.js"></script>
  <script src="../../src/js/modules/auth.js"></script>
</body>

</html>
